# Local nginx config.
# Mounted read-only at /etc/nginx/conf.d/default.conf by docker-compose.yml.
# Reachable at http://localhost:8080 (host port HTTP_PORT -> container port 80).

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/src/public;
    index index.php;

    server_tokens off;
    client_max_body_size 2m;

    charset utf-8;

    # The same security headers as production, so a page that breaks the
    # content security policy breaks here first. HSTS is ignored over http.
    include /etc/nginx/conf.d/security-headers.conf;

    # Everything that is not a real file falls through to the Slim front
    # controller, which serves both the API and the SPA shell.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Vite writes content-hashed filenames into src/public/assets, so these are
    # safe to cache forever. A new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # The SPA shell must never be cached, or a deploy leaves clients pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # PHP: the SPA shell (via the try_files fallback), /api, /cron and
    # /webhooks all land here, and none of them may be cached.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_read_timeout 300s;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # .env, .git, .htaccess and friends are never served.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
