# Production nginx config.
# Mounted read-only at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml,
# alongside /etc/letsencrypt mounted read-only from the host.
#
# ---------------------------------------------------------------------------
# CERTIFICATE PATHS ARE NOT TEMPLATED.
#
# nginx cannot interpolate environment variables in a config file, and
# deploy/deploy.sh deliberately does not rewrite this file. The certificate
# host is therefore committed literally, below: `waffle.example.com`. Change it
# when you set the project up (docs/fresh-install.md), then never again.
#
# Do NOT edit this file on the server. The next deploy overwrites any local
# change — change it here and release. nginx will not start if the referenced
# certificate is missing, and deploy.sh verifies nginx is actually serving
# before reporting success.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Port 80: ACME challenges only; everything else redirects.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /var/www/src/public;

    server_tokens off;
    client_max_body_size 2m;

    # certbot --webroot -w /var/www/certbot writes challenge files here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Cron has its own port (below). A 404 here rather than the redirect:
    # `curl -sf` neither follows a 301 nor treats one as an error, so a crontab
    # still pointing at port 80 would succeed silently and do nothing.
    location ^~ /cron/ {
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 8081: cron only.
#
# Cron on the server calls http://127.0.0.1:8081/cron/<job> (see deploy/crontab).
# docker-compose.prod.yml publishes this port on the host's loopback address
# and nowhere else, so nothing off the server can open a connection to it --
# unlike port 80, where Docker's userland proxy can present an outside
# connection as coming from the bridge gateway. The allow list is the second
# layer (loopback, and the docker bridge where the port mapping delivers
# cron's curl); CronMiddleware's X-Cron-Secret is the third.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    location ^~ /cron/ {
        allow 127.0.0.0/8;
        allow 172.16.0.0/12;
        allow ::1/128;
        deny  all;

        # Straight to the front controller; Slim routes from REQUEST_URI.
        include fastcgi_params;
        fastcgi_pass  php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/src/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_read_timeout 300s;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/waffle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waffle.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /var/www/src/public;
    index index.php;

    server_tokens off;
    # Raise only when a route genuinely needs it: every byte allowed here is a
    # byte php-fpm will parse before any check runs.
    client_max_body_size 2m;

    charset utf-8;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Cron calls the app on the loopback-only port 8081. Over HTTPS it is
    # never needed, so a leaked CRON_SECRET is no use from outside.
    location ^~ /cron/ {
        return 404;
    }

    # Vite writes content-hashed filenames, so these are immutable.
    location /assets/ {
        expires 1y;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The SPA shell must never be cached, or a deploy leaves clients pointing
    # at asset filenames that no longer exist.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           on;

        fastcgi_read_timeout 300s;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
