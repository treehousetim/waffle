# Security headers for an authenticated web app.
#
# An include rather than lines in the server block, because of how nginx
# inherits `add_header`: a location that sets ANY header of its own inherits
# NONE from the level above it. Three locations set their own `Cache-Control`
# -- /assets/, /index.html and the PHP handler -- and the PHP handler is the
# one that serves the app shell, so without this the main document would
# arrive with no security headers at all while the server block appeared to
# set them.
#
# So this file is included in the server block AND in every location that sets
# a header of its own. tests/Unit/NginxHeadersTest.php fails the build if a
# location sets `add_header` without including it.

# Pin the browser to HTTPS. `always` so it is sent on error responses too.
add_header Strict-Transport-Security "max-age=31536000" always;

# No MIME sniffing: an upload that is served back cannot become a script.
add_header X-Content-Type-Options "nosniff" always;

# What the page may load and run. Scripts only from the app itself -- nothing
# inline, nothing eval'd -- so text that reaches the page from user input
# cannot become code even if some template renders it raw. Styles allow inline
# because Vue binds style attributes. connect-src 'self' covers the API.
#
# Nothing may frame the app: a transparent overlay over a destructive button
# is the whole clickjacking attack. frame-ancestors supersedes X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Send the full path only to ourselves and only the origin elsewhere, so an
# external link never learns which record was open.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
