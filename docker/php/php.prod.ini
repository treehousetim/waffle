; production php.ini
; Baked into the image by docker/php/Dockerfile when PHP_INI=php.prod.ini
; (set by docker-compose.prod.yml).
;
; NOTE: opcache.validate_timestamps = 0 means PHP never re-reads changed source
; files. deploy.sh restarts the php container after every deploy to clear it.

[PHP]
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M
max_execution_time = 900

upload_max_filesize = 32M
post_max_size = 32M

expose_php = Off

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
