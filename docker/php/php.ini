; local development php.ini
; Baked into the image by docker/php/Dockerfile when PHP_INI=php.ini (the default).
; Production uses php.prod.ini instead.

[PHP]
; Reported in full, but never printed into a response: `docker compose logs php`
; is where notices, warnings and deprecations go. Printing them breaks more
; than it shows -- the API speaks JSON, and output before the headers stops
; the session cookie being reissued at sign-in (Delight\Auth raises
; deprecations on PHP 8.5 the first time its classes compile). An uncaught
; exception is still shown in the JSON error when APP_DEBUG is on.
display_errors = Off
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M
max_execution_time = 900

upload_max_filesize = 32M
post_max_size = 32M

[Date]
date.timezone = UTC

[opcache]
; Opcache is enabled but revalidates on every request so edits on the bind mount
; are picked up immediately. Set to 0 only in production (see php.prod.ini).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
