# Production overrides for the server at /opt/waffle.
#
# Always used together with the base file, never on its own:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# deploy/deploy.sh invokes it exactly that way, from the release it is
# deploying (/opt/waffle/releases/vN), so `.` below is that release.

# `!override` (Compose v2.24+) REPLACES the base list instead of appending to
# it. Without it, Compose merges port lists and the server would also publish
# the local-dev ports. A firewall would block them, but publishing them at all
# is a mistake we should not rely on a firewall to cover.

services:
  db:
    # Not published at all. The app reaches it as db:3306 on the Compose
    # network, and the backup runs inside it with `docker compose exec`; a
    # published port would only be one more thing listening. For a shell:
    #   doppler run -- docker compose -f docker-compose.yml -f docker-compose.prod.yml exec db mariadb -u root -p
    # !reset clears the base file's list instead of merging with it.
    ports: !reset []
    # The data is a named volume, never a path in a release: every release is
    # its own directory, so a path in one would be a new, empty database on
    # every deploy. Never `docker compose down -v` here.
    volumes: !override
      - db_data:/var/lib/mysql
    restart: unless-stopped

  php:
    build:
      args:
        # opcache on, validate_timestamps=0, display_errors off.
        # deploy.sh recreates this service on every deploy, which clears opcache.
        PHP_INI: php.prod.ini

    # Pinned here rather than left to Doppler. The base file falls back to
    # `development` when the variable is missing, and development is what lets
    # the seeder create accounts with a known password. A literal beats
    # interpolation, so no Doppler edit can undo it.
    environment:
      APP_ENV: production
      APP_DEBUG: ""
      # The site's repository (owner/name), where change notices go
      # (docs/content.md); its token is in Doppler. Empty: no site.
      SITE_REPOSITORY: ""

    # !override REPLACES the base file's volume list.
    #
    # The base file keeps vendor/ in a named volume (vendor_data). In
    # production that would be actively wrong: the runner builds vendor/ with
    # --no-dev into the release, and a named volume mounted over
    # /var/www/vendor would hide it behind whatever was installed first. The
    # bind mount is the whole point — the shipped vendor/ is the one that runs.
    volumes: !override
      # Read-only: nothing running in the container may change the release,
      # whose files the host runs too (the backup, a rollback). The app
      # writes only to storage and PHP's own temporary directory.
      - .:/var/www:ro
      - storage_data:/var/www/storage

    # No composer on the server. vendor/ arrives complete from the runner, so a
    # deploy cannot half-fail because Packagist was unreachable.
    command: sh -c "exec php-fpm"
    restart: unless-stopped

  worker:
    # As php: the production php.ini, the code shipped in the release with
    # vendor/ inside it, production settings. deploy.sh stops it before
    # migrations and starts it after php restarts (docs/queue.md, 12).
    build:
      args:
        PHP_INI: php.prod.ini
    environment:
      APP_ENV: production
      APP_DEBUG: ""
      # The site's repository (owner/name), where change notices go
      # (docs/content.md); its token is in Doppler. Empty: no site.
      SITE_REPOSITORY: ""
    volumes: !override
      # Read-only: nothing running in the container may change the release,
      # whose files the host runs too (the backup, a rollback). The app
      # writes only to storage and PHP's own temporary directory.
      - .:/var/www:ro
      - storage_data:/var/www/storage
    # The image's default user is root; the worker needs nothing root can do.
    user: www-data
    command: sh -c "exec php src/cli/worker.php"
    restart: unless-stopped

  caddy:
    # The hostname Caddy serves. Written once, by tools/rename-project.sh;
    # deploy.sh reads this line to check DNS before anything starts, and the
    # server's front Caddy (deploy/edge/Caddyfile) names the same one. A
    # literal rather than a Doppler value, like APP_ENV above: nothing per
    # environment to get wrong.
    environment:
      SITE_ADDRESS: waffle.example.com
    # No public port: the front Caddy owns 80 and 443 and reaches this one
    # over the `edge` network (docs/edge.md).
    ports: !override
      # Cron only (docker/caddy/Caddyfile). Loopback only: the crontab on this
      # server is the one caller, and binding 127.0.0.1 means nothing else --
      # IPv4 or IPv6 -- can reach it.
      - "127.0.0.1:8081:8081"
    volumes: !override
      - .:/var/www:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # On the front Caddy's network under the slug, which its Caddyfile names;
    # and on this project's own, for php.
    networks:
      default:
      edge:
        aliases: [waffle]
    restart: unless-stopped

volumes:
  db_data:
  storage_data:

# Made by the front Caddy (deploy/edge/docker-compose.yml), which is set up
# before the first deploy.
networks:
  edge:
    external: true
