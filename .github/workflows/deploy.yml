name: Deploy

# Releases only. Nothing deploys from a branch push.
#
# This workflow never reaches the server. It builds the release and attaches
# it to the GitHub release as waffle-N.tar.gz and its .sha256; the server
# pulls it from there itself, every minute, and deploys it
# (deploy/pull.sh, docs/pull-based-deployments.md).
on:
  release:
    types: [published]

# One build per release at a time.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Every action is pinned to a commit (the major version is in the comment,
# when this template was written). A tag can be moved by whoever controls the
# action's repository; a commit cannot. Re-pin deliberately, never to a
# moving tag.

jobs:
  # -------------------------------------------------------------------------
  # Build, in a job that can only read; the attach job below is the only one
  # that can write, and it runs no package manager.
  #
  # npm runs only in containers that see the frontend's source and nothing
  # else, and the build, where packages' code runs, has no network. Only
  # index.html and assets/ come out of it into the release, so nothing npm
  # runs can change the rest of what the server will run (deploy/, docker/,
  # vendor/). composer runs with plugins and scripts off, so no package's code
  # runs while vendor/ is built.
  # -------------------------------------------------------------------------
  build:
    name: Build ${{ github.event.release.tag_name }}
    # The framework's own repository publishes releases too (semver, for
    # Packagist) and has no server: never try to deploy from it. In a project
    # started from it this is always true. tools/rename-project.sh leaves this
    # line alone because it names treehousetim/waffle.
    if: github.repository != 'treehousetim/waffle'
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------------------
      # The tag is text somebody typed, and it names the file the server
      # unpacks. Only a plain version goes further. Read through the environment, never
      # spliced into a script with ${{ }}, where a quote in it would be code.
      # -------------------------------------------------------------------
      - name: Refuse anything but a version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release tag is not an app's release number (docs/releasing.md); refusing to deploy it"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # -------------------------------------------------------------------
      # The release tag, not the branch. A release published from an older
      # commit must ship that commit.
      # -------------------------------------------------------------------
      # persist-credentials: false, so no token is left in .git/config for
      # anything this job runs to find.
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # -------------------------------------------------------------------
      # The frontend, in two containers (the same node:26-alpine image
      # tools/npm.sh uses). Each mounts only src/frontend, the build adds the
      # VERSION file read-only and an empty directory to write into, and
      # neither gets this job's token, environment or the Docker socket.
      #
      # npm ci installs exactly the lockfile, checking every package against
      # its recorded hash, with install scripts off (src/frontend/.npmrc);
      # then the registry signatures are verified (docs/supply-chain.md).
      # -------------------------------------------------------------------
      - name: Install the frontend's packages, in a container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/src/frontend:/app/src/frontend" \
            -w /app/src/frontend node:26-alpine sh -euc '
              npm ci
              npm audit signatures
            '

      # The build is where packages' code runs, so it has no network: it can
      # neither fetch anything nor send anything out. It writes into
      # $RUNNER_TEMP/frontend, mounted where the build expects the web root.
      - name: Build the frontend, in a container with no network
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend"
          docker run --rm --network none \
            -v "$PWD/src/frontend:/app/src/frontend" \
            -v "$PWD/VERSION:/app/VERSION:ro" \
            -v "$RUNNER_TEMP/frontend:/app/src/public" \
            -w /app/src/frontend node:26-alpine npm run build

      # Exactly index.html and assets/, holding only plain files and
      # directories: anything else the build left (another file, a link, a
      # device) fails the release instead of being shipped.
      - name: Take only the built frontend into the release
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/frontend"
          extra="$(find "$out" -mindepth 1 -maxdepth 1 ! -name index.html ! -name assets)"
          [ -z "$extra" ] || { echo "::error::the frontend build left more than index.html and assets/: $extra"; exit 1; }
          odd="$(find "$out" ! -type f ! -type d)"
          [ -z "$odd" ] || { echo "::error::the frontend build left something that is not a plain file: $odd"; exit 1; }
          [ -f "$out/index.html" ] && [ -d "$out/assets" ] || { echo "::error::the frontend build made no index.html or assets/"; exit 1; }
          rm -rf src/public/assets src/public/index.html
          cp -R "$out/assets" src/public/assets
          cp "$out/index.html" src/public/index.html

      # -------------------------------------------------------------------
      # Build vendor/ HERE, not on the server.
      #
      # The server has no composer and no route to Packagist, so a deploy
      # cannot half-fail because a package server was down, and production
      # never needs outbound access to install anything.
      #
      # The extensions match composer.json's platform requirements so the
      # install is checked honestly rather than with --ignore-platform-req.
      # -------------------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, zip, json
          coverage: none

      # From the lock, with plugins and scripts off: no third-party code runs
      # while vendor/ is built. Then the lock is checked against known
      # vulnerabilities before anything ships (docs/supply-chain.md).
      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-plugins --no-scripts --optimize-autoloader --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-dev

      # -------------------------------------------------------------------
      # Prove the release is complete before it is attached. The server
      # checks this too, but failing here costs nothing.
      # -------------------------------------------------------------------
      - name: Verify the release artifact
        run: |
          set -euo pipefail
          for required in vendor/autoload.php src/public/index.php src/public/index.html; do
            [ -e "$required" ] || { echo "::error::missing $required"; exit 1; }
          done
          [ -d src/public/assets ] || { echo "::error::missing src/public/assets"; exit 1; }
          echo "artifact complete"

      # -------------------------------------------------------------------
      # The release: the tree the server runs, and nothing it must not. Left
      # out: what is only for development (tests/, phpunit.xml, the seeds,
      # coverage/, and src/frontend, whose built output is in src/public), what only the server has (backups/, docker/data/, .deploy/),
      # and .env files, of which there are none. The seeds stay out because
      # phinx is a runtime dependency: `phinx seed:run -e production` then has
      # nothing to run, whatever UserSeeder's own refusal says.
      # -------------------------------------------------------------------
      - name: Package the release
        run: |
          set -euo pipefail
          tar --exclude=./.git --exclude=./.github --exclude=./node_modules --exclude=./src/frontend \
            --exclude=./tests --exclude=./src/app/phinx/seeds --exclude=./phpunit.xml \
            --exclude=./.env --exclude=./.env.testing --exclude=./.deploy --exclude=./docker/data \
            --exclude=./backups --exclude=./coverage --exclude=./.phpunit.cache \
            -czf "$RUNNER_TEMP/waffle-${TAG}.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum "waffle-${TAG}.tar.gz" > "waffle-${TAG}.tar.gz.sha256"

      - name: Hand the release to the attach job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/waffle-${{ env.TAG }}.tar.gz
            ${{ runner.temp }}/waffle-${{ env.TAG }}.tar.gz.sha256
          retention-days: 3

  # -------------------------------------------------------------------------
  # Attach: the only job that can write to the repository, and it runs
  # neither npm nor composer. A process a package started in the build job
  # cannot outlive that job, so it never holds this job's write token.
  # -------------------------------------------------------------------------
  attach:
    name: Attach ${{ github.event.release.tag_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Refuse anything but a version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release tag is not an app's release number (docs/releasing.md); refusing to attach it"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Take the release from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release

      # The server deploys a release only once both files are attached and the
      # checksum matches (deploy/pull.sh).
      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c "waffle-${TAG}.tar.gz.sha256"
          gh release upload "$TAG" "waffle-${TAG}.tar.gz" "waffle-${TAG}.tar.gz.sha256" --clobber
