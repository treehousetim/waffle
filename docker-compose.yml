# Local development stack.
#
#   docker compose up -d                  -> http://localhost:8080
#   ./tools/test.sh                       -> runs the suite inside the php container
#
# No `version:` key: it is obsolete under Compose v2+ and only produces a warning.
#
# Every value below has a local default after `:-`, and none is secret, so a
# fresh clone comes up with no setup -- and the DB defaults are exactly what
# .env.testing assumes. In production, deploy.sh runs Compose under
# `doppler run --` with the server's prod-serve config, which supplies the
# real values for the ${...} interpolation.
#
# THE ENVIRONMENT BLOCK OF THE php SERVICE IS THE AUTHORITATIVE LIST OF CONFIG
# KEYS. Adding a config value means adding it there *and* to the Doppler
# configs; nothing reads a key Compose does not pass through.

# The Compose project's name: containers, networks and volumes are named for
# the project's slug, not for whatever folder it was cloned into (on the server
# that folder is /opt/<slug>, so the two agree).
name: waffle

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${DB_NAME:-waffle}
      MARIADB_USER: ${DB_USER:-waffle}
      MARIADB_PASSWORD: ${DB_PASSWORD:-waffle}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # For a desktop database client only: the app, the tests and the backup
      # all reach MariaDB inside Docker. 11020 because it is unlikely to be in
      # use, by another MySQL/MariaDB on 3306 or another project's stack.
      # Loopback only: the development credentials are the defaults above, and
      # 0.0.0.0 would offer them to everybody on the same network. Override
      # DB_HOST_PORT in your shell if 11020 is taken. Production publishes
      # nothing (docker-compose.prod.yml).
      - "127.0.0.1:${DB_HOST_PORT:-11020}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./docker/php
      args:
        PHP_INI: ${PHP_INI:-php.ini}
    working_dir: /var/www
    # Secrets are INJECTED, not written to disk.
    #
    # There is no .env file anywhere in this design. In production Compose is
    # invoked under `doppler run --`, which puts the secrets in Compose's own environment;
    # each value below is interpolated from there into the container. Nothing
    # sensitive is ever at rest on the server, and a failed deploy cannot leave
    # a stale half-written secrets file behind.
    #
    # Two things make this work, both verified rather than assumed:
    #   - the official php:fpm image sets `clear_env = no` in
    #     /usr/local/etc/php-fpm.d/docker.conf, so the container environment
    #     reaches FPM workers (the default, clear_env = yes, would not)
    #   - `docker compose exec` inherits the container environment, so phinx
    #     sees these during migrations without any extra plumbing
    #
    # The worker service reads the same block (the &app_environment anchor).
    environment: &app_environment
      # composer runs as root in this container; skip its interactive warning.
      COMPOSER_ALLOW_SUPERUSER: "1"

      # Defaulted to `development` so that a plain `docker compose up` is
      # explicitly a development box. UserSeeder allowlists this value; in
      # production docker-compose.prod.yml pins APP_ENV=production and the
      # seeder refuses. Behaviour is governed by APP_DEBUG, off unless asked.
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-}

      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-waffle}
      DB_USER: ${DB_USER:-waffle}
      DB_PASSWORD: ${DB_PASSWORD:-waffle}

      CRON_SECRET: ${CRON_SECRET:-}

      # Change notices to the site (docs/content.md). Unset here, so a
      # development box tells no site anything; production sets both.
      SITE_REPOSITORY: ${SITE_REPOSITORY:-}
      SITE_DISPATCH_TOKEN: ${SITE_DISPATCH_TOKEN:-}

      # Bootstrap credentials for the very first owner account, read once by
      # the CreateInitialOwner migration. Both may be deleted from Doppler
      # after the account exists — the migration is recorded in phinxlog by
      # then, and skips on its own regardless.
      FIRST_USERNAME: ${FIRST_USERNAME:-}
      FIRST_USER_PASSWORD: ${FIRST_USER_PASSWORD:-}
    volumes:
      - .:/var/www
      # vendor/ lives in a named volume: it stays out of the bind mount so
      # installs are fast and host/container platform builds never collide.
      - vendor_data:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && exec php-fpm"

  worker:
    # The queue's worker (docs/queue.md): the same image and environment as
    # php, running src/cli/worker.php. It exits after a share of jobs or
    # memory, and `restart` starts a fresh one; SIGTERM lets the job in hand
    # finish within stop_grace_period. It waits for php's composer install.
    build:
      context: ./docker/php
      args:
        PHP_INI: ${PHP_INI:-php.ini}
    working_dir: /var/www
    environment: *app_environment
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; exec php src/cli/worker.php"
    restart: unless-stopped
    # The php:fpm image stops with SIGQUIT; the worker is not php-fpm.
    stop_signal: SIGTERM
    stop_grace_period: 60s

  caddy:
    # The web server (docker/caddy/Caddyfile, docs/https.md). The same file
    # serves production, where SITE_ADDRESS is the hostname and Caddy handles
    # the certificate; here ":80" means plain HTTP and no certificate.
    image: caddy:2.11
    environment:
      SITE_ADDRESS: ":80"
    ports:
      # 8080 is the documented local port. Override HTTP_PORT in your shell
      # (not in Doppler) if something else on the machine already owns it.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php

volumes:
  vendor_data:
  caddy_data:
  caddy_config:
